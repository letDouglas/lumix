<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Image Metadata</title>
    <style>
        #processing-message {
            font-size: 30px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin: 20px 0;
        }
        #rendered-image-message {
            font-size: 24px;
            color: green;
            text-align: center;
            margin: 20px 0;
        }
        #rendered-image-link {
            font-size: 24px;
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>
<body>
<h2>Rendered Image</h2>
<p id="processing-message" style="display: block;">Processing...</p>
<p id="rendered-image-message" style="display: none; color: green;">
    Your rendered image is ready!
    <a id="rendered-image-link" style="display: none;" th:href="@{/download/}">Download Rendered Image</a>
</p>
<a href="/">Back to Upload</a>
<a href="/images">View All Images</a>

<script>
    function checkForRenderedImage() {
        const eventSource = new EventSource("/sse-rendered-image");
        eventSource.onmessage = function(event) {
            if (event.data) {
                const renderedFileName = event.data;
                const downloadLink = document.getElementById("rendered-image-link");
                const message = document.getElementById("rendered-image-message");
                const processingMessage = document.getElementById("processing-message");

                if (downloadLink && message && processingMessage) {
                    // Hide "Processing..."
                    processingMessage.style.display = "none";
                    // Show "ready" message and download link
                    downloadLink.href = "/download/" + renderedFileName;
                    downloadLink.style.display = "inline";
                    message.style.display = "block";
                }
            }
        };
        eventSource.onerror = function() {
            eventSource.close();
            setTimeout(checkForRenderedImage, 5000);
        };
    }
    // Start checking when the page loads
    window.onload = checkForRenderedImage;
</script>
</body>
</html>
